name: Python library and web tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[web]" build
      - run: python -m unittest discover -s tests -v
        env:
          MODELTRACE_PUBLIC: '1'
          MODELTRACE_ALLOWED_HOSTS: unrelated.example
          PYTHONUTF8: '0'
      - run: python -m build
      - run: python tests/verify_installation.py --wheels dist/modeltrace-0.1.0-py3-none-any.whl
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/test_api_analysis_retry.mjs
