[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modeltrace"
version = "0.1.0"
description = "Numeric response fingerprints for comparing model API outputs"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"

[project.optional-dependencies]
web = ["Flask>=3.0,<4", "click>=8.1.3,<9"]

[tool.vercel]
entrypoint = "app:app"

[project.urls]
Repository = "https://github.com/FastR-D/ModelTrace"

[tool.setuptools.packages.find]
include = ["modeltrace*"]

[tool.setuptools.cmdclass]
build_py = "modeltrace._build.BuildPy"

[tool.setuptools.package-data]
modeltrace = ["data/*.json"]
